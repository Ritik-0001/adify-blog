name: Publish Next Queued Post

on:
  # Trigger manually from the GitHub Actions UI
  workflow_dispatch:

  # Trigger via GitHub API — this is what n8n calls
  # POST https://api.github.com/repos/{owner}/{repo}/dispatches
  # Body: { "event_type": "publish-post" }
  repository_dispatch:
    types: [publish-post]

  # Cron schedule — 16x per day, every 90 minutes (UTC times, IST = UTC+5:30)
  # 00:30 UTC = 06:00 IST  |  02:00 UTC = 07:30 IST
  # 03:30 UTC = 09:00 IST  |  05:00 UTC = 10:30 IST
  # 06:30 UTC = 12:00 IST  |  08:00 UTC = 13:30 IST
  # 09:30 UTC = 15:00 IST  |  11:00 UTC = 16:30 IST
  # 12:30 UTC = 18:00 IST  |  14:00 UTC = 19:30 IST
  # 15:30 UTC = 21:00 IST  |  17:00 UTC = 22:30 IST
  # 18:30 UTC = 00:00 IST  |  20:00 UTC = 01:30 IST
  # 21:30 UTC = 03:00 IST  |  23:00 UTC = 04:30 IST
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 2 * * *'
    - cron: '30 3 * * *'
    - cron: '0 5 * * *'
    - cron: '30 6 * * *'
    - cron: '0 8 * * *'
    - cron: '30 9 * * *'
    - cron: '0 11 * * *'
    - cron: '30 12 * * *'
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
    - cron: '30 18 * * *'
    - cron: '0 20 * * *'
    - cron: '30 21 * * *'
    - cron: '0 23 * * *'

concurrency:
  group: publish-queue
  cancel-in-progress: false   # queue runs, never cancel an in-progress publish

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit + push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Move oldest queued post to /posts
        run: node scripts/publish-next.js

      - name: Commit and push (if a post was published)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --staged --quiet; then
            echo "No post was moved — queue may be empty."
            echo "post_slug=" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(git diff --staged --name-only | grep '^posts/[^/]*\.mdx$' | sed 's|^posts/||; s|\.mdx$||')
            echo "post_slug=$SLUG" >> "$GITHUB_OUTPUT"
            git commit -m "publish: move next queued post to /posts"
            git pull --rebase origin main
            git push
          fi

      - name: Notify IndexNow
        if: steps.commit.outputs.post_slug != ''
        run: |
          POST_SLUG="${{ steps.commit.outputs.post_slug }}"
          curl -s -o /dev/null -w "IndexNow HTTP status: %{http_code}\n" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"adify.store\",
              \"key\": \"${{ secrets.INDEXNOW_KEY }}\",
              \"urlList\": [\"https://adify.store/blog/$POST_SLUG\"]
            }"

      - name: Ping Bing sitemap
        if: steps.commit.outputs.post_slug != ''
        run: |
          curl -s -o /dev/null -w "Bing ping HTTP status: %{http_code}\n" \
            "https://www.bing.com/ping?sitemap=https://adify.store/sitemap.xml"
